name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Installer and Publish Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v2.txt

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "ToriiKanji" --paths "app" --icon "assets/Icon/Icon.ico" --add-data "assets;assets" --add-data "tesseract;tesseract" app/main.py

      - name: Compile Inno Setup Installer
        uses: jrsoftware/inno-setup-action@v1
        with:
          filepath: setup.iss

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Release tag will be: ${TAG_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "ToriiKanji ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Output/*.exe
